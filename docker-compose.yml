version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pickup-counter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pickup_counter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickup_counter"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pickup-counter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pickup_counter
      WEBHOOK_SECRET: pickup_counter_super_secret_key_2026
      HOLD_DURATION_SECONDS: 120
      NODE_ENV: production
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pickup-counter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  pgdata:
